<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>進化系統測試</title>
<style>
  body{font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif;margin:0;padding:16px;background:#f6f3ea;color:#2d2a24}
  h1{font-size:20px;margin:0 0 8px} .sum{margin:8px 0 14px;font-weight:700}
  table{border-collapse:collapse;width:100%;background:#fff} td{border-bottom:1px solid #e6e0d0;padding:6px 8px;vertical-align:top;font-size:13px}
  .ok{color:#2f7d3b;font-weight:700} .bad{color:#b3261e;font-weight:700} code{font-size:12px;color:#6b6457}
  details{margin-top:16px;background:#fff;padding:8px 12px} pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<h1>小袋二世｜27 型態進化系統：自動測試</h1>
<p>只測試進化規則與統計（js/evo27.js），不會讀寫遊戲存檔。遊戲內的整合測試在 <code>index.html?evotest</code> 的測試面板。</p>
<div class="sum" id="sum">測試中…</div>
<table id="t"></table>
<details><summary>每條進化路線（69 條）</summary><pre id="edges"></pre></details>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import { runAll } from '../js/evo27_test.js';
import * as X from '../js/evo27.js';
const src = await (await fetch('../js/evo27.js')).text();
const R = runAll([['engine_source_has_no_eval', () => ({ok:!/\beval\s*\(|new Function\s*\(/.test(src), info:'js/evo27.js'})]]);
const pass = R.filter(r => r.ok).length;
document.getElementById('sum').innerHTML = `<span class="${pass === R.length ? 'ok' : 'bad'}">${pass} / ${R.length} 通過</span>`;
document.getElementById('t').innerHTML = R.map(r => `<tr><td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'}</td><td>${r.name}</td><td><code>${r.info}</code></td></tr>`).join('');
const nm = id => (X.FORM27[id] || {}).name || id;
document.getElementById('edges').textContent = X.EDGES.map(e => `${nm(e.from)} → ${nm(e.to)}  [${e.priority}${e.fallback ? '・保底' : ''}]  ${e.human_condition}`).join('\n');
window.__results = R;
</script>
</body></html>
